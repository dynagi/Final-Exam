global:
  scrape_interval: 5s
  evaluation_interval: 5s

# The crypto-service (npm start) and ai-service (uvicorn) run natively on the
# host, not in Docker — Prometheus reaches them via host.docker.internal,
# which Docker Desktop resolves to the host on both Windows and macOS.
scrape_configs:
  - job_name: crypto-service
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4000"]
        labels:
          service: crypto-service

  - job_name: ai-service
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service: ai-service
